name: rdagent
channels:
  - conda-forge
  - defaults
dependencies:
  # Python 基础
  - python=3.10
  - pip

  # 核心科学计算
  - numpy<2.0
  - pandas
  - scipy
  - scikit-learn
  - numexpr
  - tables

  # 可视化
  - matplotlib
  - seaborn
  - plotly

  # 配置与工具
  - pyyaml
  - jinja2
  - python-dotenv
  - filelock
  - tqdm
  - loguru
  - fire
  - typer
  - rich
  - humanize

  # 网络与 API
  - requests
  - httpx
  - urllib3

  # 开发与测试
  - pytest
  - black
  - ruff
  - setuptools-scm

  # 容器与环境
  - docker

  # Pip 安装的包
  - pip:
      # === 核心基础 ===
      - pydantic
      - pydantic-settings
      - python-Levenshtein
      - fuzzywuzzy
      - rapidfuzz

      # === LLM 与 AI ===
      - openai
      - anthropic
      - litellm>=1.73
      - tiktoken
      - langchain
      - langchain-community
      - langchain-core
      - google-generativeai

      # === HuggingFace 生态 ===
      - torch>=2.0
      - torchvision
      - torchaudio
      - torch_geometric
      - pytorch-lightning
      - transformers>=4.40,<5.0
      - peft>=0.18.1
      - trl>=0.27.0
      - accelerate>=1.0.0
      - bitsandbytes
      - safetensors
      - sentence-transformers
      - datasets>=3.0.0
      - huggingface_hub>=0.20.0
      - tokenizers

      # === 传统 ML ===
      - catboost
      - xgboost
      - lightgbm
      - optuna

      # === 实验追踪 ===
      - mlflow
      - wandb
      - tensorboard
      - azureml-mlflow

      # === Azure AI ===
      - azure-identity
      - azure-ai-formrecognizer
      - azure-ai-inference
      - azure-mgmt-core
      - azure-storage-blob
      - azure-core

      # === PyQLib ===
      - pyqlib>=0.9.0

      # === 并行与分布式 ===
      - pandarallel
      - prefect
      - ray

      # === Web 框架 ===
      - streamlit>=1.47
      - flask>=2.2.5
      - flask-cors>=2.2.5
      - st-theme
      - gunicorn
      - uvicorn
      - fastapi

      # === 浏览器与爬虫 ===
      - selenium
      - webdriver-manager
      - playwright
      - kaggle
      - duckduckgo-search
      - beautifulsoup4
      - lxml

      # === PDF 处理 ===
      - pymupdf
      - pypdf

      # === 数据处理 ===
      - pyarrow
      - fastparquet

      # === 代码工具 ===
      - tree-sitter-python
      - tree-sitter
      - evalplus

      # === RL 生态 ===
      - gymnasium
      - gym>=0.24.0
      - stable-baselines3
      - alfworld
      - textworld
      - alpaca-eval

      # === WebShop ===
      - webshop
      - gdown
      - cleantext==1.1.4
      - pyserini==0.17.0
      - rank_bm25==0.2.2
      - thefuzz==0.19.0
      - spacy==3.7.2
      # WebShop 需要固定版本
      - flask==2.2.5
      - Werkzeug==2.2.3

      # === Agent 框架 ===
      - pydantic-ai-slim[mcp,openai,prefect]
      - nest-asyncio

      # === 工具库 ===
      - randomname
      - genson
      - networkx
      - nbformat

      # === 类型定义 ===
      - types-pytz

      # === 文档工具 ===
      - sphinx
      - sphinx_rtd_theme
      - furo
