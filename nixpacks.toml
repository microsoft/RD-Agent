[phases.setup]
nixPkgs = ["python311", "nodejs_20"]

[phases.install]
cmds = [
  "python3 -m pip install --upgrade pip setuptools wheel",
  "python3 -m pip install .",
  "cd web && npm ci"
]

[phases.build]
cmds = ["cd web && npm run build:flask"]

[start]
cmd = "rdagent server_ui --port ${PORT:-19899}"
